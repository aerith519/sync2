<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF7;
    --ink:#1B1F23;
    --ink-soft:#5C6167;
    --line:#DEDDD4;
    --line-strong:#C7C5B8;
    --accent:#2B6E6E;
    --row-hover:#F1F0EA;
    --error:#B3452C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:820px; margin:0 auto; padding:48px 24px 80px; }
  header{ margin-bottom:28px; }
  .title{ font-size:15px; font-weight:600; letter-spacing:0.02em; margin:0 0 4px; }
  .subtitle{ font-size:13px; color:var(--ink-soft); margin:0; }
  nav.crumbs{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    line-height:1.6;
    padding:14px 16px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    margin-bottom:18px;
    overflow-x:auto;
    white-space:nowrap;
  }
  nav.crumbs button{
    background:none; border:none; font-family:inherit; font-size:inherit;
    color:var(--accent); cursor:pointer; padding:2px 3px;
  }
  nav.crumbs button:hover{ text-decoration:underline; }
  nav.crumbs button:disabled{
    color:var(--ink); cursor:default; text-decoration:none; font-weight:500;
  }
  nav.crumbs .sep{ color:var(--line-strong); padding:0 2px; }
  .listing{ border:1px solid var(--line); border-radius:3px; background:#fff; overflow:hidden; }
  .row{
    display:flex; align-items:center; gap:12px; padding:11px 16px;
    border-bottom:1px solid var(--line); cursor:pointer; text-decoration:none;
    color:var(--ink); background:none; width:100%; text-align:left;
    font-family:inherit; font-size:inherit;
  }
  .row:last-child{ border-bottom:none; }
  .row:hover{ background:var(--row-hover); }
  .row:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .icon{ width:20px; text-align:center; flex-shrink:0; font-size:15px; }
  .icon.dir{ color:var(--accent); }
  .icon.file{ color:var(--ink-soft); }
  .name{
    font-family:'IBM Plex Mono',monospace; font-size:14px; flex:1;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .meta{ font-size:12px; color:var(--ink-soft); flex-shrink:0; font-family:'IBM Plex Mono',monospace; }
  .state{ padding:32px 16px; text-align:center; color:var(--ink-soft); font-size:14px; }
  .state.err{ color:var(--error); }
  footer{ margin-top:24px; font-size:12px; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="title" id="siteTitle">Files</p>
    <p class="subtitle">Browse your files</p>
  </header>

  <nav class="crumbs" id="crumbs"></nav>

  <div class="listing" id="listing">
    <div class="state">Loading…</div>
  </div>

  <footer>Updates automatically every few minutes</footer>
</div>

<script>
const listingEl = document.getElementById("listing");
const crumbsEl  = document.getElementById("crumbs");

let crumbs = []; // stack of folder nodes, root first

function renderCrumbs(){
  let html = "";
  crumbs.forEach((node, i) => {
    const isLast = i === crumbs.length - 1;
    if (i > 0) html += `<span class="sep">/</span>`;
    html += `<button ${isLast ? "disabled" : ""} data-index="${i}">${node.name}</button>`;
  });
  crumbsEl.innerHTML = html;
  crumbsEl.querySelectorAll("button:not(:disabled)").forEach(btn=>{
    btn.addEventListener("click", () => {
      crumbs = crumbs.slice(0, Number(btn.dataset.index) + 1);
      render();
    });
  });
}

function formatSize(bytes){
  const n = Number(bytes);
  if (!n) return "";
  if (n < 1024) return n + " B";
  if (n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  return (n/(1024*1024)).toFixed(1) + " MB";
}

function iconForFile(filename){
  const ext = (filename.split(".").pop() || "").toLowerCase();
  const map = {
    png:"🖼️", jpg:"🖼️", jpeg:"🖼️", gif:"🖼️", svg:"🖼️", webp:"🖼️",
    pdf:"📄", doc:"📄", docx:"📄", txt:"📄", md:"📄",
    zip:"🗜️", rar:"🗜️", "7z":"🗜️",
    mp3:"🎵", wav:"🎵",
    mp4:"🎬", mov:"🎬",
  };
  return map[ext] || "📄";
}

function render(){
  renderCrumbs();
  const node = crumbs[crumbs.length - 1];
  const children = node.children || [];

  if (children.length === 0){
    listingEl.innerHTML = `<div class="state">This folder is empty.</div>`;
    return;
  }

  const folders = children.filter(c => c.type === "folder").sort((a,b)=>a.name.localeCompare(b.name));
  const files   = children.filter(c => c.type === "file").sort((a,b)=>a.name.localeCompare(b.name));

  let rowsHtml = "";
  if (crumbs.length > 1){
    rowsHtml += `<button class="row" id="backBtn"><span class="icon dir">↩</span><span class="name">..</span></button>`;
  }
  folders.forEach((f, i) => {
    rowsHtml += `<button class="row" data-child-index="${children.indexOf(f)}">
      <span class="icon dir">📁</span><span class="name">${f.name}</span>
      <span class="meta">${f.children.length} item${f.children.length === 1 ? "" : "s"}</span>
    </button>`;
  });
  files.forEach(f => {
    rowsHtml += `<a class="row" href="${f.url}" target="_blank" rel="noopener">
      <span class="icon file">${iconForFile(f.name)}</span><span class="name">${f.name}</span>
      <span class="meta">${formatSize(f.size)}</span>
    </a>`;
  });

  listingEl.innerHTML = rowsHtml;

  listingEl.querySelectorAll("[data-child-index]").forEach(el=>{
    el.addEventListener("click", () => {
      const child = children[Number(el.dataset.childIndex)];
      crumbs.push(child);
      render();
    });
  });
  const backBtn = document.getElementById("backBtn");
  if (backBtn){
    backBtn.addEventListener("click", () => {
      crumbs.pop();
      render();
    });
  }
}

async function init(){
  try{
    const res = await fetch("udrop-listing.json", { cache: "no-store" });
    if (!res.ok) throw new Error("not found");
    const root = await res.json();
    document.title = root.name;
    document.getElementById("siteTitle").textContent = root.name;
    crumbs = [root];
    render();
  } catch(err){
    listingEl.innerHTML = `<div class="state err">Couldn't load udrop-listing.json. Make sure the GitHub Action has run at least once (check the Actions tab in your repo).</div>`;
  }
}

init();
</script>
</body>
</html>
