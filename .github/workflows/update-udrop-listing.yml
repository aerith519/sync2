name: Update udrop file listing

on:
  schedule:
    - cron: "*/5 * * * *"    # refreshes roughly every 5 minutes
  workflow_dispatch: {}       # adds a "Run workflow" button under the Actions tab

permissions:
  contents: write

jobs:
  update-listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate listing
        env:
          UDROP_KEY1: ${{ secrets.UDROP_KEY1 }}
          UDROP_KEY2: ${{ secrets.UDROP_KEY2 }}
        run: node generate-udrop-manifest.js

      - name: Commit updated listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add udrop-listing.json
          git diff --staged --quiet || git commit -m "Update udrop file listing"
          git push
